[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numpygrad"
version = "1.0.0"
description = "A modular, educational deep learning library and dynamic tensor autograd engine built completely from scratch using pure Python and NumPy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "NumPyGrad Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.64.0,<2",
    "streamlit-drawable-canvas>=0.13.0,<0.14",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "pillow>=9.5.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Htet-Aung/numpygrad"
Repository = "https://github.com/Htet-Aung/numpygrad"

[tool.setuptools.packages.find]
where = ["src"]
